[workspace]
# Virtual manifest. Libraries live under crates/; each runnable demo is its own binary crate under
# examples/ (run with `cargo run -p <name>`), so demos carry only the dependencies they need.
resolver = "3"
members = [
    "crates/kiln-rhi",
    "crates/kiln-egui",
    "crates/kiln-app",
    "examples/triangle-graphics",
    "examples/triangle-mesh",
    "examples/spectral",
    "examples/egui-demo",
]
