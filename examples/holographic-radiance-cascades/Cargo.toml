[package]
name = "hrc"
version = "0.1.0"
edition = "2024"
description = "Holographic Radiance Cascades: interactive 2D global illumination against an analytic SDF scene, traced with hardware ray query."

[dependencies]
kiln-rhi = { path = "../../crates/kiln-rhi" }
# The window, present loop and egui context; the overlay painter is kiln-egui behind its feature.
kiln-app = { path = "../../crates/kiln-app", default-features = false, features = ["egui"] }
# Direct because the Example::ui implementation is compiled in this crate.
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
# `gpu_struct!` expands to zerocopy derives that name `::zerocopy` at this crate's root.
zerocopy = { version = "0.8", features = ["derive"] }
glam = { version = "0.33.1", features = ["zerocopy"] }
# Scene/probe-budget CLI; flattens kiln-app's `HarnessOpts`.
clap = { version = "4.6.1", features = ["derive"] }
# Encodes the PNGs `--verify --save` writes.
image = { version = "0.25", default-features = false, features = ["png"] }
