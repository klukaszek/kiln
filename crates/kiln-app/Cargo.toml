[package]
name = "kiln-app"
version = "0.1.0"
edition = "2024"
description = "Windowing/present harness for the Kiln RHI demos, with an optional egui debug overlay (gated by the `egui` feature)."

[features]
# egui overlay on by default; depend with `default-features = false` for an egui-free harness.
default = ["egui"]
egui = ["dep:egui", "dep:egui-winit", "dep:kiln-egui"]

[dependencies]
kiln-rhi = { path = "../kiln-rhi" }
# Harness math (FrameCtx extent).
glam = { version = "0.33.1", features = ["zerocopy"] }
# Windowing + raw handles for the RHI surface API.
winit = "0.30"
raw-window-handle = "0.6"
# Routes the RHI's Vulkan validation callback to stderr when validation is on.
log = "0.4"
# Harness CLI options (HarnessOpts); examples flatten it into their own clap structs.
clap = { version = "4.6.1", features = ["derive"] }

# egui debug overlay (optional, default-on). The painter lives in kiln-egui; egui-winit drives
# input. default_fonts so the overlay's text renders.
kiln-egui = { path = "../kiln-egui", optional = true }
egui = { version = "0.34", default-features = false, features = ["default_fonts"], optional = true }
egui-winit = { version = "0.34", default-features = false, optional = true }
